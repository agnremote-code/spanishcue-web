<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TPT cover</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 750px; overflow: hidden; }
  body {
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, {{COLOR_A}} 0%, {{COLOR_B}} 100%);
    position: relative;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(circle at 85% 15%, rgba(255,255,255,.28), transparent 45%), radial-gradient(circle at 10% 95%, rgba(0,0,0,.22), transparent 50%); }
  .frame { position: absolute; inset: 28px; border: 3px solid rgba(255,255,255,.55); border-radius: 26px; }
  .brand { position: absolute; top: 58px; left: 64px; font-weight: 900; font-size: 30px; letter-spacing: .32em; }
  .level { position: absolute; top: 52px; right: 64px; background: #fff; color: {{COLOR_A}}; font-weight: 900; font-size: 24px; letter-spacing: .08em; padding: 10px 22px; border-radius: 999px; }
  .title { position: absolute; left: 64px; right: {{TITLE_RIGHT}}px; top: 150px; bottom: 170px; display: flex; align-items: center; }
  .title h1 { font-weight: 900; font-size: {{TITLE_SIZE}}px; line-height: 1.02; letter-spacing: -.02em; text-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .sub { position: absolute; left: 64px; bottom: 112px; font-size: 30px; font-weight: 700; opacity: .95; }
  .grades { position: absolute; left: 64px; bottom: 58px; font-size: 22px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; background: rgba(0,0,0,.22); padding: 8px 18px; border-radius: 10px; }
  .mascot { position: absolute; right: 40px; bottom: 30px; height: 420px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.3)); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="brand">SPANISHCUE</div>
  <div class="level">{{LEVEL}}</div>
  <div class="title"><h1>{{HEADLINE}}</h1></div>
  <div class="sub">{{SUBLINE}}</div>
  <div class="grades">Grades {{GRADES}} · Print and go</div>
  {{MASCOT}}
</body>
</html>
