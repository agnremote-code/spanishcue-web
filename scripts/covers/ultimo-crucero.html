<script>
  // Rain: drawn from the outside of the <svg>, so the HTML parser leaves the script alone.
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = document.getElementById('rain'), NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 1700 - 50, y = rnd() * 900, l = 26 + rnd() * 30, line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', x.toFixed(1)); line.setAttribute('y1', y.toFixed(1));
    line.setAttribute('x2', (x - l * .32).toFixed(1)); line.setAttribute('y2', (y + l).toFixed(1));
    g.appendChild(line);
  }
  document.title = 'ready';
</script>
