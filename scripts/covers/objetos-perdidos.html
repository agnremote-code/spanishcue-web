<!-- Objetos perdidos: the cover's key art, drawn as a cartoon scene in the mascots' doll style
     (big heads, round eyes, soft shading). The new night clerk studies a set of false teeth with a
     magnifying glass at the counter of the municipal lost-and-found office, Don Evaristo grins
     without them, Fígaro the parrot supervises from the shelves and the paper lanterns of the
     festival drift past the window before dawn.
     Open it in Chromium at 1600×900, save the screenshot as scripts/covers/art/objetos-perdidos.webp,
     then run: node scripts/covers/render.mjs mundos objetos-perdidos -->

  <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#5b3a20"/></linearGradient>

  <linearGradient id="tuba" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e2a93a"/><stop offset="1" stop-color="#9c6a17"/></linearGradient>
