<!doctype html>
<!-- The classic conversation covers (1600×900) as film key art: a painted
     scene from scripts/covers/art/<art>.webp, a dark fade on the left and the
     title set like a film poster. Text stays between y 130 and 770 so the
     184 px library cards keep it. Rendered by scripts/covers/render.mjs,
     which fills window.COVER. -->
<html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Josefin+Sans:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
#cover{position:relative;width:1600px;height:900px;overflow:hidden;background:#000;color:#fff}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,20,.86) 0%,rgba(6,8,20,.62) 30%,rgba(6,8,20,0) 58%),linear-gradient(0deg,rgba(6,8,20,.55) 0%,rgba(6,8,20,0) 40%)}
.text{position:absolute;left:96px;bottom:150px;width:var(--w,700px)}
.kicker{display:inline-flex;align-items:center;gap:14px;font:700 24px/1 'Josefin Sans',sans-serif;letter-spacing:6px;text-transform:uppercase;color:var(--accent)}
.kicker b{display:inline-block;padding:9px 14px 6px;border-radius:6px;background:var(--accent);color:#14101a;letter-spacing:2px;font-size:26px}
h1{margin:18px 0 0;font:400 var(--size)/1 'Lilita One',sans-serif;letter-spacing:1px;text-wrap:balance;text-shadow:0 4px 0 rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.55)}
.mark{margin-top:22px;font:700 20px/1 'Josefin Sans',sans-serif;letter-spacing:5px;text-transform:uppercase;opacity:.8}
</style>
<div id="cover"><img id="art" alt=""><div class="fade"></div>
<div class="text"><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="mark">SpanishCue</div></div></div>
<script>
(async () => {
  const k = window.COVER;
  const root = document.getElementById('cover');
  root.style.setProperty('--accent', k.accent || '#ffd166');
  const len = k.title.length;
  root.style.setProperty('--size', (len > 30 ? 74 : len > 18 ? 88 : 110) + 'px');
  if (len > 30) root.style.setProperty('--w', '760px');
  const kicker = document.getElementById('kicker');
  if (/^[ABC][12]$/.test(k.kicker)) kicker.innerHTML = `<b>${k.kicker}</b>Conversación`;
  else kicker.textContent = k.kicker;
  document.getElementById('title').textContent = k.title;
  const img = document.getElementById('art');
  img.style.objectPosition = k.focus || 'center';
  img.src = k.artUrl;
  await img.decode();
  await document.fonts.ready;
  document.title = 'ready';
})();
</script>
</html>
