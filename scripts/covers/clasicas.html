<!doctype html>
<!-- The classic conversation covers (1600×900): ink on a cloth-bound cover,
     one engraved emblem in a paper medallion and the title in a serif. The
     content stays between y 130 and 770 so the 184 px library cards keep it.
     Rendered by scripts/covers/render.mjs, which fills window.COVER. -->
<html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Josefin+Sans:wght@600&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
#cover{position:relative;width:1600px;height:900px;overflow:hidden;background:var(--ink);color:var(--paper)}
#cloth{position:absolute;inset:0;mix-blend-mode:overlay}
.frame{position:absolute;inset:44px;border:2px solid color-mix(in srgb,var(--paper) 55%,transparent)}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent)}
.medal{position:absolute;left:250px;top:200px;width:500px;height:500px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 14px var(--ink),0 0 0 17px color-mix(in srgb,var(--paper) 70%,transparent),0 30px 60px rgba(0,0,0,.35)}
.medal svg{position:absolute;left:75px;top:75px;width:350px;height:350px;color:var(--ink);fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.medal::before{content:"";position:absolute;inset:22px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--ink) 45%,transparent)}
.text{position:absolute;left:840px;top:170px;width:620px;height:560px;display:flex;flex-direction:column;justify-content:center}
.kicker{font:600 26px/1 'Josefin Sans',sans-serif;letter-spacing:7px;text-transform:uppercase;opacity:.85}
.rule{display:flex;align-items:center;gap:14px;margin:30px 0;opacity:.75}
.rule i{flex:0 0 90px;height:2px;background:currentColor}.rule b{width:10px;height:10px;transform:rotate(45deg);border:2px solid currentColor}
h1{margin:0;font:700 var(--size)/1.08 'Playfair Display',Georgia,serif;letter-spacing:-.5px;text-wrap:balance}
.mark{margin-top:34px;font:italic 500 30px/1 'Playfair Display',Georgia,serif;opacity:.7}
</style>
<div id="cover"><canvas id="cloth" width="1600" height="900"></canvas><div class="frame"></div>
<div class="medal"><svg viewBox="0 0 200 200" id="emblem"></svg></div>
<div class="text"><div class="kicker" id="kicker"></div><div class="rule"><i></i><b></b><i></i></div><h1 id="title"></h1><div class="mark">SpanishCue</div></div></div>
<script>
(async () => {
  const k = window.COVER;
  const root = document.getElementById('cover');
  root.style.setProperty('--ink', k.ink); root.style.setProperty('--paper', k.paper);
  const len = k.title.length;
  root.style.setProperty('--size', (len > 30 ? 64 : len > 20 ? 76 : 92) + 'px');
  document.getElementById('emblem').innerHTML = k.emblem;
  document.getElementById('kicker').textContent = k.kicker;
  document.getElementById('title').textContent = k.title;
  // cloth: fine woven grain and a soft light from the upper left
  const c = document.getElementById('cloth').getContext('2d');
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const img = c.createImageData(1600, 900), d = img.data;
  for (let y = 0; y < 900; y++) for (let x = 0; x < 1600; x++) {
    const i = (y * 1600 + x) * 4, n = (r() - 0.5) * 22 + ((x % 3 === 0) ? 5 : 0) + ((y % 3 === 0) ? -5 : 0);
    d[i] = d[i + 1] = d[i + 2] = 128 + n; d[i + 3] = 34;
  }
  c.putImageData(img, 0, 0);
  const g = c.createRadialGradient(300, 150, 50, 600, 400, 1300);
  g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(0,0,0,.30)');
  c.fillStyle = g; c.fillRect(0, 0, 1600, 900);
  await document.fonts.ready;
  document.title = 'ready';
})();
</script></html>
