<!doctype html>
<!-- Covers of Roleplays del mundo hispano (1600×1000, saved at 1200×750): the
     country's painted scene from scripts/covers/art/roleplays-<slug>.webp
     (ChatGPT, 2026-11-24), a dark fade on the left, the flag and the title.
     Rendered by scripts/covers/roleplays-hispanos.mjs, which fills window.COVER. -->
<html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Josefin+Sans:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
#cover{position:relative;width:1600px;height:1000px;overflow:hidden;background:#000;color:#fff}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,20,.84) 0%,rgba(6,8,20,.55) 30%,rgba(6,8,20,0) 56%),linear-gradient(0deg,rgba(6,8,20,.55) 0%,rgba(6,8,20,0) 40%)}
.text{position:absolute;left:110px;bottom:170px;width:720px}
.kicker{display:flex;align-items:center;gap:16px;font:700 26px/1 'Josefin Sans',sans-serif;letter-spacing:5px;text-transform:uppercase;color:#ffd166}
.kicker img{height:46px;border-radius:6px;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 6px 18px rgba(0,0,0,.5)}
.kicker b{padding:9px 14px 6px;border-radius:6px;background:#ffd166;color:#14101a;letter-spacing:1px}
h1{margin:22px 0 0;font:400 var(--size)/1 'Lilita One',sans-serif;letter-spacing:1px;text-wrap:balance;text-shadow:0 4px 0 rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.55)}
.mark{margin-top:24px;font:700 22px/1 'Josefin Sans',sans-serif;letter-spacing:5px;text-transform:uppercase;opacity:.8}
</style>
<div id="cover"><img id="art" alt=""><div class="fade"></div>
<div class="text"><div class="kicker"><img id="flag" alt=""><b>A1–A2</b>Roleplays</div><h1 id="title"></h1><div class="mark">SpanishCue</div></div></div>
<script>
(async () => {
  const k = window.COVER;
  const title = document.getElementById('title');
  title.textContent = k.name;
  document.getElementById('cover').style.setProperty('--size', (k.name.length > 16 ? 96 : k.name.length > 10 ? 118 : 140) + 'px');
  const flag = document.getElementById('flag'); flag.src = k.flagUrl;
  const img = document.getElementById('art'); img.src = k.artUrl;
  await Promise.all([img.decode(), flag.decode()]);
  await document.fonts.ready;
  document.title = 'ready';
})();
</script>
</html>
