<script>
// Deterministic stars and meteors (no randomness between renders).
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const stars = document.getElementById('stars');
for (let i = 0; i < 520; i++) {
  const c = document.createElementNS(NS, 'circle');
  const y = Math.pow(rnd(), 1.3) * 600;
  c.setAttribute('cx', (rnd() * 1600).toFixed(1)); c.setAttribute('cy', y.toFixed(1));
  const big = rnd();
  c.setAttribute('r', (big > 0.97 ? 2.6 : big > 0.85 ? 1.6 : 0.9).toFixed(1));
  c.setAttribute('opacity', (0.35 + rnd() * 0.65).toFixed(2));
  if (big > 0.92) c.setAttribute('fill', rnd() > 0.5 ? '#ffe2b8' : '#cfe0ff');
  stars.appendChild(c);
}
const meteors = document.getElementById('meteors');
const rad = [1380, 40];
for (let i = 0; i < 16; i++) {
  const a = Math.PI * (0.62 + rnd() * 0.3), d0 = 120 + rnd() * 520, len = 70 + rnd() * 150;
  const x1 = rad[0] + Math.cos(a) * d0, y1 = rad[1] + Math.sin(a) * d0;
  const x2 = rad[0] + Math.cos(a) * (d0 + len), y2 = rad[1] + Math.sin(a) * (d0 + len);
  if (y2 > 520) continue;
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', x1.toFixed(1)); l.setAttribute('y1', y1.toFixed(1)); l.setAttribute('x2', x2.toFixed(1)); l.setAttribute('y2', y2.toFixed(1));
  l.setAttribute('stroke', '#e6eeff'); l.setAttribute('opacity', (0.45 + rnd() * 0.5).toFixed(2)); l.setAttribute('stroke-width', (1.6 + rnd() * 2.4).toFixed(1));
  meteors.appendChild(l);
}
</script>
