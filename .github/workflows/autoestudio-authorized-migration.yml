name: Autoestudio 0011 dedicated owner-authorized operation

# One explicit operation, authorized by the owner on 2026-10-02.
# Not triggered by main, PR merge, normal publication or rollback.
on:
  push:
    branches: [codex/autoestudio-d1-resolve-20261002]
    paths: [.github/workflows/autoestudio-authorized-migration.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: autoestudio-0011-authorized-operation
  cancel-in-progress: false

jobs:
  merged-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.merged.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: Wait for CI automatic merge and released merge lock
        id: merged
        run: |
          for attempt in $(seq 1 90); do
            git fetch origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              if node scripts/autoestudio-migration-operation.mjs --check-coordination; then
                echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
                exit 0
              else
                STATUS=$?
                test "$STATUS" = 75 || exit "$STATUS"
              fi
            fi
            sleep 15
          done
          echo '::error::Source not merged or merge lock still busy; no D1 operation performed.'
          exit 1

  production-d1:
    needs: merged-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      AUTOESTUDIO_MIGRATION_TARGET: production
      RELEASE_SOURCE_SHA: ${{ needs.merged-source.outputs.sha }}
      AUTOESTUDIO_AUTHORIZATION: apply 0011 4a040f541101ea47766b1403ad933accd8cc1afb73b4c8dec2f04d30118ca51d
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.merged-source.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare secret without deployment before any SQL
        run: node scripts/autoestudio-migration-operation.mjs --provision-secret
      - name: Check coordination and refresh export and disposable restore
        run: |
          node scripts/autoestudio-migration-operation.mjs --check-coordination
          node scripts/autoestudio-d1-preflight.mjs
      - name: Execute exactly approved 0011 once
        run: node scripts/autoestudio-migration-operation.mjs
      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoestudio-production-operation-${{ github.run_id }}
          path: migration-evidence/*.json
          retention-days: 30

  staging-d1:
    needs: [merged-source, production-d1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AUTOESTUDIO_MIGRATION_TARGET: staging
      RELEASE_SOURCE_SHA: ${{ needs.merged-source.outputs.sha }}
      AUTOESTUDIO_AUTHORIZATION: apply 0011 4a040f541101ea47766b1403ad933accd8cc1afb73b4c8dec2f04d30118ca51d
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.merged-source.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare independent staging secret without deployment before SQL
        run: node scripts/autoestudio-migration-operation.mjs --provision-secret
      - name: Verify isolated binding, export and disposable restore
        run: node scripts/autoestudio-d1-preflight.mjs
      - name: Prepare same exact 0011 and independent staging signing secret
        run: node scripts/autoestudio-migration-operation.mjs
      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoestudio-staging-operation-${{ github.run_id }}
          path: migration-evidence/*.json
          retention-days: 30

  resume-official-release:
    needs: [merged-source, staging-d1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.merged-source.outputs.sha }}
    steps:
      - name: Retry official staging gate for exactly the merged SHA
        run: |
          for attempt in $(seq 1 45); do
            RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?head_sha=$SHA&event=push" --jq '.workflow_runs[0] | {id,status,conclusion}')"
            ID="$(echo "$RUN" | jq -r '.id')"
            STATUS="$(echo "$RUN" | jq -r '.status')"
            RESULT="$(echo "$RUN" | jq -r '.conclusion')"
            if [ "$ID" = null ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/dispatches" -f ref=main -f inputs[action]=deploy -f inputs[sha]="$SHA"
              exit 0
            fi
            if [ "$STATUS" = completed ]; then
              if [ "$RESULT" = failure ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$ID/rerun-failed-jobs"
              else
                test "$RESULT" = success
              fi
              echo "Official staging run: $ID; SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo '::error::Official staging still busy; no alternate deploy attempted.'
          exit 1
