name: Diagnose lesson report email

on:
  push:
    branches: [automation/diagnose-report-email-20261002]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Inspect live Worker bindings
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/spanishcue/settings" \
            > worker-settings.json

          jq -r '
            .result.bindings[]
            | select(.name=="RESEND_API_KEY" or .name=="LESSON_REPORT_NOTIFICATION_EMAIL" or .name=="CHESPANISH_OWNER_EMAIL")
            | [.name,.type,(if .type=="secret_text" then "<secret-present>" else (.text // .value // "<present>") end)]
            | @tsv
          ' worker-settings.json

          jq -e '.result.bindings[] | select(.name=="RESEND_API_KEY" and .type=="secret_text")' worker-settings.json >/dev/null
          jq -e '.result.bindings[] | select((.name=="LESSON_REPORT_NOTIFICATION_EMAIL" or .name=="CHESPANISH_OWNER_EMAIL"))' worker-settings.json >/dev/null

      - name: Inspect recent report persistence
        run: |
          set -euo pipefail
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const db=process.env.PRODUCTION_D1_ID;
          const res=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{
            method:'POST',
            headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify({sql:"SELECT id, lesson_title, created_at FROM lesson_reports ORDER BY created_at DESC LIMIT 5"})
          });
          const data=await res.json();
          if(!res.ok||data.success===false) throw new Error("D1 query failed");
          console.log(JSON.stringify(data.result?.[0]?.results||[],null,2));
          NODE
