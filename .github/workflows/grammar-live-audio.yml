name: Grammar live audio

on:
  push:
    branches: ["claude/clase-inicial-*", "claude/gramatica-en-vivo-*"]
    paths: ["app/grammar-classroom/live/audio/clips.json", "scripts/generate-grammar-live-audio.py", ".github/workflows/grammar-live-audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grammar-live-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthesis tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -U edge-tts
      - name: Synthesize
        run: python scripts/generate-grammar-live-audio.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A public/audio/grammar-live app/grammar-classroom/live/audio/manifest.json
          if git diff --cached --quiet; then echo "No audio changes"; exit 0; fi
          git commit -m "Generate grammar live audio"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
