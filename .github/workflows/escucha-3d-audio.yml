name: Escucha 3D audio

on:
  push:
    branches: ["claude/escucha-3d-*"]
    paths: ["app/escucha-3d/content/**", "scripts/generate-escucha-3d-audio.py", ".github/workflows/escucha-3d-audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escucha-3d-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthesis tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install edge-tts==7.2.8
      - name: Synthesize
        run: python scripts/generate-escucha-3d-audio.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/audio/escucha-3d app/escucha-3d/audio-manifest.json
          if git diff --cached --quiet; then echo "No audio changes"; exit 0; fi
          git commit -m "Generate Escucha 3D audio"
          git push origin HEAD:${GITHUB_REF_NAME}
