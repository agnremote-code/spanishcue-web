name: Autoestudio D1 read-only preflight
on:
  push:
    branches: [codex/autoestudio-share-pass-20261002]
    paths:
      - scripts/autoestudio-d1-preflight.mjs
      - .github/workflows/autoestudio-d1-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autoestudio-d1-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: Verify binding, existing schema, export and disposable restore
        run: node scripts/autoestudio-d1-preflight.mjs
      - name: Preserve metadata only (never customer data or export URL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoestudio-d1-preflight-${{ github.sha }}
          path: migration-evidence/preflight.json
          retention-days: 7
