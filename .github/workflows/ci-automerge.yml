name: CI + Auto Merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR merge candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full regression suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Revalidate deployable artifact
        run: npm run validate:artifact

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD

  merge:
    needs: verify
    if: >
      needs.verify.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: main-automerge
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Build fresh merge candidate against current main
        run: |
          git fetch origin main
          FRESH_BASE_SHA="$(git rev-parse origin/main)"
          echo "FRESH_BASE_SHA=$FRESH_BASE_SHA" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main

      - name: Reverify against current main
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run validate:artifact
          git diff --check origin/main...HEAD

      - name: Confirm tested refs are still current
        run: |
          CURRENT_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          CURRENT_BASE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD_SHA"
          test "$CURRENT_BASE" = "$FRESH_BASE_SHA"

      - name: Merge verified PR
        run: |
          RESULT="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="$EXPECTED_HEAD_SHA" \
            -f merge_method="merge")"
          echo "$RESULT"
          test "$(echo "$RESULT" | jq -r '.merged')" = "true"
          MERGE_SHA="$(echo "$RESULT" | jq -r '.sha')"
          test -n "$MERGE_SHA"
          test "$MERGE_SHA" != "null"
          echo "MERGE_SHA=$MERGE_SHA" >> "$GITHUB_ENV"

      - name: Check out merged main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0

      - name: Post-merge health check
        id: postmerge
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run validate:artifact

      - name: Automatically roll back a broken merge
        if: steps.postmerge.outcome == 'failure'
        run: |
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT_MAIN" = "$MERGE_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert -m 1 --no-edit "$MERGE_SHA"
          git commit --amend -m "[auto-rollback] Revert ${MERGE_SHA:0:12} after failed post-merge health"
          ROLLBACK_SHA="$(git rev-parse HEAD)"
          ROLLBACK_BRANCH="automation/rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$ROLLBACK_BRANCH"

          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run validate:artifact

          git push origin "$ROLLBACK_BRANCH"
          PR_JSON="$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="[auto-rollback] Revert failed merge ${MERGE_SHA:0:12}" \
            -f head="$ROLLBACK_BRANCH" \
            -f base="main" \
            -f body="Automatic rollback after the merged commit failed the post-merge health gate. The reverted tree passed the full regression suite, lint, and artifact validation before this rollback PR was created.")"
          ROLLBACK_PR="$(echo "$PR_JSON" | jq -r '.number')"

          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT_MAIN" = "$MERGE_SHA"

          RESULT="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${ROLLBACK_PR}/merge" \
            -f sha="$ROLLBACK_SHA" \
            -f merge_method="merge")"
          echo "$RESULT"
          test "$(echo "$RESULT" | jq -r '.merged')" = "true"

          ENCODED_ROLLBACK_REF="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["ROLLBACK_BRANCH"], safe=""))
          PY
          )"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ENCODED_ROLLBACK_REF}" || true
        env:
          ROLLBACK_BRANCH: ""

      - name: Delete merged feature branch
        if: steps.postmerge.outcome == 'success'
        continue-on-error: true
        run: |
          ENCODED_REF="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))
          PY
          )"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ENCODED_REF}"
