name: Partners exact owner-authorized D1 operation

# Dedicated operation explicitly authorized by the owner, 2026-11-10.
# Only this task branch can initiate it; never a general deploy/migration hook.
on:
  push:
    branches: [codex/partners-d1-authorized-20261110]
    paths: [.github/workflows/partners-authorized-migration.yml]

permissions:
  contents: read

concurrency:
  group: partners-exact-authorized-operation
  cancel-in-progress: false

jobs:
  merged-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.merged.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: Wait for verified merge and released merge lock
        id: merged
        run: |
          for attempt in $(seq 1 140); do
            git fetch origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              if node scripts/partners-migration-operation.mjs --check-coordination; then
                echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
                exit 0
              else
                STATUS=$?
                test "$STATUS" = 75 || exit "$STATUS"
              fi
            fi
            sleep 15
          done
          echo '::error::Verified merge/coordination not ready; no SQL executed.'
          exit 1

  production-d1:
    needs: merged-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.merged-source.outputs.sha }}
      PARTNERS_AUTHORIZATION: apply partners 7107020f64c27a1c5f2abebebf16c6d04848ff60cbb9958816cebaa6e4111a86
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.merged-source.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify backup, rehearse and apply only authorized partner SQL
        run: node scripts/partners-migration-operation.mjs
      - name: Preserve sanitized operation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partners-production-operation-${{ github.run_id }}
          path: migration-evidence/partners-operation.json
          retention-days: 30
