name: Diagnose Paddle pricing bindings

on:
  push:
    branches: [automation/diagnose-paddle-pricing-20261002]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect live Paddle pricing bindings
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/spanishcue/settings" \
            > worker-settings.json
          jq -r '
            .result.bindings[]
            | select(.type=="plain_text")
            | select(.name|test("PADDLE|FOUNDER_PRICE|FOUNDER_OFFER"))
            | [.name, (.text // .value // "")]
            | @tsv
          ' worker-settings.json | sort
