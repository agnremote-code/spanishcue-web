name: Main Health + Auto Rollback

on:
  push:
    branches: [main]

concurrency:
  group: main-health
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pushed main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full regression suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Revalidate deployable artifact
        run: npm run validate:artifact

  rollback:
    needs: verify
    if: needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BAD_SHA: ${{ github.sha }}

    steps:
      - name: Check out failing main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Recheck once to avoid transient rollbacks
        id: retry
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund &&
          npm test &&
          npm run lint &&
          npm run validate:artifact
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "rollback=false" >> "$GITHUB_OUTPUT"
            echo "Second verification passed; treating the first failure as transient."
            exit 0
          fi
          echo "rollback=true" >> "$GITHUB_OUTPUT"

      - name: Guard rollback target
        id: guard
        if: steps.retry.outputs.rollback == 'true'
        run: |
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CURRENT_MAIN" != "$BAD_SHA" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "main moved after this failure; refusing to revert a stale commit."
            exit 0
          fi

          MESSAGE="$(git show -s --format=%B "$BAD_SHA")"
          if printf '%s' "$MESSAGE" | grep -Fq '[auto-rollback]'; then
            echo "Refusing to roll back an automatic rollback commit."
            exit 1
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Build and validate revert
        id: revert
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PARENT_COUNT="$(git show -s --format=%P "$BAD_SHA" | wc -w | tr -d ' ')"
          if [ "$PARENT_COUNT" -gt 1 ]; then
            git revert -m 1 --no-edit "$BAD_SHA"
          else
            git revert --no-edit "$BAD_SHA"
          fi

          git commit --amend -m "[auto-rollback] Revert ${BAD_SHA:0:12} after failed main health"
          ROLLBACK_SHA="$(git rev-parse HEAD)"
          ROLLBACK_BRANCH="automation/main-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "rollback_sha=$ROLLBACK_SHA" >> "$GITHUB_OUTPUT"
          echo "rollback_branch=$ROLLBACK_BRANCH" >> "$GITHUB_OUTPUT"

          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run validate:artifact

          git checkout -b "$ROLLBACK_BRANCH"
          git push origin "$ROLLBACK_BRANCH"

      - name: Merge validated rollback
        if: steps.guard.outputs.proceed == 'true'
        env:
          ROLLBACK_SHA: ${{ steps.revert.outputs.rollback_sha }}
          ROLLBACK_BRANCH: ${{ steps.revert.outputs.rollback_branch }}
        run: |
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT_MAIN" = "$BAD_SHA"

          PR_JSON="$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="[auto-rollback] Restore main after failed health check" \
            -f head="$ROLLBACK_BRANCH" \
            -f base="main" \
            -f body="Automatic rollback created only after the failing main commit failed twice and the reverted tree passed the full regression suite, lint, and artifact validation.")"
          ROLLBACK_PR="$(echo "$PR_JSON" | jq -r '.number')"

          RESULT="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${ROLLBACK_PR}/merge" \
            -f sha="$ROLLBACK_SHA" \
            -f merge_method="merge")"
          echo "$RESULT"
          test "$(echo "$RESULT" | jq -r '.merged')" = "true"

          ENCODED_REF="$(python - "$ROLLBACK_BRANCH" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
          )"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ENCODED_REF}" || true
