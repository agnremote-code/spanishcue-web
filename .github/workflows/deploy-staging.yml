name: Deploy Staging (Cloudflare)

# Every verified merge is deployed to staging first. After staging smoke passes,
# this workflow automatically dispatches the owner-authorized production release
# for the exact same SHA and waits for its production smoke/rollback result.
# The staging build itself remains isolated: scripts/prepare-staging-worker-config.mjs
# forces the spanishcue-staging Worker, spanishcue-staging D1, workers.dev only
# and no routes. It applies only the owner-authorized CREATE-only lesson_reports SQL; no other D1 migrations or touches spanishcue.com directly.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy or rollback
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      sha:
        description: Exact 40-character SHA already on main (deploy only)
        required: false
      version_id:
        description: Worker version ID to restore (rollback only; empty = previous version)
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
      SHA: ${{ github.event_name == 'push' && github.sha || inputs.sha }}
      VERSION_ID: ${{ inputs.version_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      STAGING_URL: https://spanishcue-staging.agnremote.workers.dev
    steps:
      - name: Require staging token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN_STAGING is not set in the 'staging' environment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Variable CLOUDFLARE_ACCOUNT_ID is not set in the 'staging' environment."
            exit 1
          fi

      - name: Validate inputs
        run: |
          if [ "$ACTION" = "deploy" ]; then
            [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::sha must be a full 40-character SHA"; exit 1; }
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.action == 'deploy' && inputs.sha || 'main') }}
          fetch-depth: 0

      - name: Require SHA to be on main
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and validate exact SHA
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: |
          npm run build
          npm run validate:artifact

      # Owner authorization 2026-10-02: resolve the two Autoestudio release gates.
      # This is idempotent: it never rotates an existing secret and executes
      # 0011 only when no autoestudio_* schema objects exist yet.
      - name: Bootstrap Autoestudio Share Pass prerequisites in staging
        if: github.event_name == 'push' || inputs.action == 'deploy'
        env:
          AUTOESTUDIO_D1_ID: 23fe3c11-85f7-48e1-9dd0-d508893625c9
          AUTOESTUDIO_WORKER: spanishcue-staging
          AUTOESTUDIO_SQL_SHA256: 4a040f541101ea47766b1403ad933accd8cc1afb73b4c8dec2f04d30118ca51d
        run: |
          ACTUAL_SQL_SHA256="$(sha256sum drizzle/0011_autoestudio_share.sql | awk '{print $1}')"
          test "$ACTUAL_SQL_SHA256" = "$AUTOESTUDIO_SQL_SHA256"

          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$AUTOESTUDIO_WORKER/settings" \
            > autoestudio-worker-settings.json

          if ! jq -e '.result.bindings[]? | select(.type == "secret_text" and .name == "AUTOESTUDIO_SHARE_SECRET")' autoestudio-worker-settings.json >/dev/null; then
            echo "Provisioning missing Autoestudio signing secret on $AUTOESTUDIO_WORKER."
            AUTOESTUDIO_SHARE_SECRET="$(openssl rand -hex 32)"
            echo "::add-mask::$AUTOESTUDIO_SHARE_SECRET"
            SECRET_PAYLOAD="$(jq -nc --arg text "$AUTOESTUDIO_SHARE_SECRET" '{name:"AUTOESTUDIO_SHARE_SECRET",text:$text,type:"secret_text"}')"
            curl --fail-with-body -sS -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$SECRET_PAYLOAD" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$AUTOESTUDIO_WORKER/secrets" \
              > autoestudio-secret-put.json
            jq -e '.success == true' autoestudio-secret-put.json >/dev/null
          fi

          npx wrangler d1 execute "$AUTOESTUDIO_D1_ID" --remote \
            --command "SELECT name FROM sqlite_master WHERE name LIKE 'autoestudio_%' ORDER BY name" \
            --json > autoestudio-schema-before.json
          OBJECT_COUNT="$(jq '[.[].results[]? | select(.name | startswith("autoestudio_"))] | length' autoestudio-schema-before.json)"
          if [ "$OBJECT_COUNT" = "0" ]; then
            npx wrangler d1 execute "$AUTOESTUDIO_D1_ID" --remote --file=drizzle/0011_autoestudio_share.sql --yes
          fi

          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$AUTOESTUDIO_WORKER/settings" \
            > autoestudio-worker-settings-after.json
          jq -e '.result.bindings[]? | select(.type == "secret_text" and .name == "AUTOESTUDIO_SHARE_SECRET")' autoestudio-worker-settings-after.json >/dev/null

      - name: Rewrite build config for staging
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: node scripts/prepare-staging-worker-config.mjs dist/server/wrangler.json

      - name: Prepare authorized lesson reports table in staging
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: |
          npx wrangler d1 execute DB --remote --config dist/server/wrangler.json --command "$(cat drizzle/0010_lesson_reports.sql)" --yes
          npx wrangler d1 execute DB --remote --config dist/server/wrangler.json --command "PRAGMA table_info(lesson_reports)" --json > report-schema.json
          node scripts/verify-lesson-reports-schema.mjs report-schema.json

      - name: Record current staging version
        if: github.event_name == 'push' || inputs.action == 'deploy'
        id: previous
        run: |
          if npx wrangler deployments list --name spanishcue-staging --json > previous.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy staging Worker
        if: github.event_name == 'push' || inputs.action == 'deploy'
        id: deploy
        # Upload a version, then deploy it at 100%. Unlike `wrangler deploy`,
        # this does not manage triggers or the workers.dev route (enabled when
        # the Worker was created), so the token needs no account-level
        # subdomain access.
        run: |
          npx wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "staging ${SHA}" | tee upload.log
          VERSION="$(grep -oiE 'Worker Version ID: [0-9a-f-]{36}' upload.log | head -n 1 | awk '{print $4}')"
          test -n "$VERSION"
          npx wrangler versions deploy "${VERSION}@100%" --name spanishcue-staging --message "staging ${SHA}" --yes
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          {
            echo "Staging URL: $STAGING_URL"
            echo "Deployed SHA: $SHA"
            echo "Worker version: $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for staging to serve the new version
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: sleep 15

      - name: Staging smoke
        if: github.event_name == 'push' || inputs.action == 'deploy'
        id: smoke
        continue-on-error: true
        env:
          SPANISHCUE_PRODUCTION_ORIGIN: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/production-smoke.mjs
          node scripts/lesson-reports-smoke.mjs
          curl -sfI "$SPANISHCUE_PRODUCTION_ORIGIN/" | grep -qi '^x-robots-tag: noindex'
          curl -sf "$SPANISHCUE_PRODUCTION_ORIGIN/api/billing/founder-status" | grep -q '"mode":"sandbox"'

      - name: Roll back staging after failed smoke
        if: (github.event_name == 'push' || inputs.action == 'deploy') && steps.smoke.outcome == 'failure' && steps.previous.outputs.exists == 'true'
        run: |
          npx wrangler rollback --name spanishcue-staging --message "auto rollback after failed smoke for ${SHA}" --yes
          exit 1

      - name: Fail first deploy with failed smoke
        if: (github.event_name == 'push' || inputs.action == 'deploy') && steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Promote verified staging SHA to production
        if: (github.event_name == 'push' || inputs.action == 'deploy') && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CURRENT_MAIN" != "$SHA" ]; then
            echo "main advanced to $CURRENT_MAIN after staging $SHA; a newer staging run will promote it."
            exit 0
          fi

          SUCCESS_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Deploy Production (Cloudflare, owner-authorized)" and .conclusion == "success")] | sort_by(.id) | last | .id // empty')"
          if [ -n "$SUCCESS_RUN" ]; then
            echo "Production already succeeded for $SHA in run $SUCCESS_RUN."
            exit 0
          fi

          ACTIVE_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Deploy Production (Cloudflare, owner-authorized)" and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending"))] | sort_by(.id) | last | .id // empty')"

          if [ -z "$ACTIVE_RUN" ]; then
            BEFORE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Deploy Production (Cloudflare, owner-authorized)") | .id] | max // 0')"

            gh workflow run deploy-production.yml \
              --ref main \
              -f action=deploy \
              -f mode=release \
              -f sha="$SHA" \
              -f confirm="deploy $SHA"

            for attempt in $(seq 1 60); do
              ACTIVE_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
                --jq "[.workflow_runs[] | select(.name == \"Deploy Production (Cloudflare, owner-authorized)\" and .id > $BEFORE_ID)] | sort_by(.id) | last | .id // empty")"
              if [ -n "$ACTIVE_RUN" ]; then
                break
              fi
              sleep 2
            done
          fi

          test -n "$ACTIVE_RUN"
          echo "Production run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${ACTIVE_RUN}"
          timeout 1800 gh run watch "$ACTIVE_RUN" --exit-status

      - name: Manual staging rollback
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        run: npx wrangler rollback ${VERSION_ID:+"$VERSION_ID"} --name spanishcue-staging --message "manual staging rollback" --yes
