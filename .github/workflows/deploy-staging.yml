name: Deploy Staging (Cloudflare)

# Owner-controlled STAGING only. This workflow cannot deploy production:
# scripts/prepare-staging-worker-config.mjs forces the spanishcue-staging
# Worker, the spanishcue-staging D1, workers.dev only and no routes, and
# fails on any production name, route or the placeholder D1.
# It never applies D1 migrations and never touches spanishcue.com.

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or rollback
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      sha:
        description: Exact 40-character SHA already on main (deploy only)
        required: false
      version_id:
        description: Worker version ID to restore (rollback only; empty = previous version)
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      ACTION: ${{ inputs.action }}
      SHA: ${{ inputs.sha }}
      VERSION_ID: ${{ inputs.version_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      STAGING_URL: https://spanishcue-staging.agnremote.workers.dev
    steps:
      - name: Require staging token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN_STAGING is not set in the 'staging' environment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Variable CLOUDFLARE_ACCOUNT_ID is not set in the 'staging' environment."
            exit 1
          fi

      - name: Validate inputs
        run: |
          if [ "$ACTION" = "deploy" ]; then
            [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::sha must be a full 40-character SHA"; exit 1; }
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.action == 'deploy' && inputs.sha || 'main' }}
          fetch-depth: 0

      - name: Require SHA to be on main
        if: inputs.action == 'deploy'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and validate exact SHA
        if: inputs.action == 'deploy'
        run: |
          npm run build
          npm run validate:artifact

      - name: Rewrite build config for staging
        if: inputs.action == 'deploy'
        run: node scripts/prepare-staging-worker-config.mjs dist/server/wrangler.json

      - name: Record current staging version
        if: inputs.action == 'deploy'
        id: previous
        run: |
          if npx wrangler deployments list --name spanishcue-staging --json > previous.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy staging Worker
        if: inputs.action == 'deploy'
        id: deploy
        # Upload a version, then deploy it at 100%. Unlike `wrangler deploy`,
        # this does not manage triggers or the workers.dev route (enabled when
        # the Worker was created), so the token needs no account-level
        # subdomain access.
        run: |
          npx wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "staging ${SHA}" | tee upload.log
          VERSION="$(grep -oiE 'Worker Version ID: [0-9a-f-]{36}' upload.log | head -n 1 | awk '{print $4}')"
          test -n "$VERSION"
          npx wrangler versions deploy "${VERSION}@100%" --name spanishcue-staging --message "staging ${SHA}" --yes
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          {
            echo "Staging URL: $STAGING_URL"
            echo "Deployed SHA: $SHA"
            echo "Worker version: $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for staging to serve the new version
        if: inputs.action == 'deploy'
        run: sleep 15

      - name: Staging smoke
        if: inputs.action == 'deploy'
        id: smoke
        continue-on-error: true
        env:
          SPANISHCUE_PRODUCTION_ORIGIN: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/production-smoke.mjs
          curl -sfI "$SPANISHCUE_PRODUCTION_ORIGIN/" | grep -qi '^x-robots-tag: noindex'
          curl -sf "$SPANISHCUE_PRODUCTION_ORIGIN/api/billing/founder-status" | grep -q '"mode":"sandbox"'

      - name: Roll back staging after failed smoke
        if: inputs.action == 'deploy' && steps.smoke.outcome == 'failure' && steps.previous.outputs.exists == 'true'
        run: |
          npx wrangler rollback --name spanishcue-staging --message "auto rollback after failed smoke for ${SHA}" --yes
          exit 1

      - name: Fail first deploy with failed smoke
        if: inputs.action == 'deploy' && steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Manual staging rollback
        if: inputs.action == 'rollback'
        run: npx wrangler rollback ${VERSION_ID:+"$VERSION_ID"} --name spanishcue-staging --message "manual staging rollback" --yes
