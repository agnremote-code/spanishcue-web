# INACTIVE DRAFT. GitHub Actions does not run files outside .github/workflows.
# Target: .github/workflows/deploy-cloudflare.yml (Phase 2 staging, Phase 4 production).
name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character merged SHA on main
        required: true
      target:
        description: staging or production
        required: true
        default: staging
  workflow_call:
    inputs:
      sha: { type: string, required: true }
      target: { type: string, required: true }

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: write # state-branch compare-and-swap only

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha }}
      TARGET: ${{ inputs.target }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Staging and production use different, narrowly scoped tokens stored in
      # their GitHub environments.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SPANISHCUE_PRODUCTION_ORIGIN: ${{ vars.SPANISHCUE_ORIGIN }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET" == staging || "$TARGET" == production ]]

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Require SHA to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Classify against last healthy release
        run: |
          # TODO(phase 2): read last healthy SHA for $TARGET from the release
          # state branch (adapted to Cloudflare version IDs).
          LAST_HEALTHY="<read from state>"
          node scripts/release-policy.mjs classify "$LAST_HEALTHY" "$SHA"
          # Exit 42 fails the job: migration-sensitive changes need
          # MIGRATION_RELEASE.md and d1-migrate first.

      - name: Acquire release lock (compare-and-swap, never steal)
        run: echo "TODO(phase 2) reuse release-policy.mjs transition acquire"

      - name: Build and validate exact SHA
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run validate:artifact

      - name: Record previous version for rollback
        run: |
          npx wrangler deployments list --env "$TARGET" --json > previous.json
          # Persist previous version ID into release state before deploying.

      - name: Upload and deploy version
        run: |
          npx wrangler versions upload --env "$TARGET" --tag "$SHA" --message "spanishcue $SHA"
          # Deploy the uploaded version at 100%; persist its version ID.
          npx wrangler versions deploy --env "$TARGET" --yes

      - name: Smoke
        id: smoke
        continue-on-error: true
        run: node scripts/production-smoke.mjs

      - name: Roll back on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "TODO(phase 2): wrangler rollback <previous version id> --env $TARGET"
          node scripts/production-smoke.mjs
          exit 1

      - name: Record healthy and unlock
        if: steps.smoke.outcome == 'success'
        run: echo "TODO(phase 2) transition healthy(smokePassed=true)"
