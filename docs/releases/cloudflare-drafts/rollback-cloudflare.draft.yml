# INACTIVE DRAFT. Target: .github/workflows/rollback-cloudflare.yml (Phase 2).
# Redeploys a recorded Worker version. Never touches D1.
name: Rollback Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: staging or production
        required: true
      version_id:
        description: Previous healthy Worker version ID from release state
        required: true

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SPANISHCUE_PRODUCTION_ORIGIN: ${{ vars.SPANISHCUE_ORIGIN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Roll back Worker version
        run: npx wrangler rollback "${{ inputs.version_id }}" --env "${{ inputs.target }}" --message "manual rollback" --yes
      - name: Smoke
        run: node scripts/production-smoke.mjs
      - name: Record restored state
        run: echo "TODO(phase 2) transition restored(smokePassed=true) with failed SHA"
