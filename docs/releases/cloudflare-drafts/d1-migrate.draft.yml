# INACTIVE DRAFT. Target: .github/workflows/d1-migrate.yml (Phase 2).
# The only path that applies D1 migrations. Never called by deploy or rollback.
# The GitHub environment must require a reviewer.
name: D1 Migrate

on:
  workflow_dispatch:
    inputs:
      target:
        description: staging or production
        required: true
      apply:
        description: false = list pending only; true = apply
        required: true
        default: "false"

concurrency:
  group: d1-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}-d1
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: spanishcue-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: List pending migrations
        run: npx wrangler d1 migrations list "$DB_NAME" --remote --env "${{ inputs.target }}"
      - name: Apply migrations
        if: inputs.apply == 'true'
        run: |
          # Production: only after a Time Travel bookmark is recorded and
          # MIGRATION_RELEASE.md is satisfied. Never re-apply 0000-0009.
          npx wrangler d1 time-travel info "$DB_NAME" --env "${{ inputs.target }}"
          npx wrangler d1 migrations apply "$DB_NAME" --remote --env "${{ inputs.target }}"
